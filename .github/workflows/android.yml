name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build và kiểm thử
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài đặt Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kiểm tra checksum của Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Chạy unit test và build bản debug
        env:
          # Client ID là public, nhưng đưa qua secret để không phải commit vào repo.
          # Nếu chưa đặt secret thì build vẫn chạy; chỉ luồng đăng nhập Microsoft báo lỗi lúc chạy.
          ORG_GRADLE_PROJECT_XOYO_MS_CLIENT_ID: ${{ secrets.XOYO_MS_CLIENT_ID }}
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Lưu báo cáo kiểm thử khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Lưu APK debug
        uses: actions/upload-artifact@v4
        with:
          name: xoyo-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
