name: Android CI

on:
  push:
    branches: [ main, zalith-base ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build và kiểm thử
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài đặt Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kiểm tra checksum của Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Cài Android NDK 25.2 (native build)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;25.2.9519653"

      - name: Cài Rust và các target Android (PetLib)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: PetLib/rust

      - name: Cài cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Chạy unit test và build bản debug
        env:
          # Client ID là public, nhưng đưa qua secret để không phải commit vào repo.
          # Nếu chưa đặt secret thì build vẫn chạy; chỉ luồng đăng nhập Microsoft báo lỗi lúc chạy.
          OAUTH_CLIENT_ID: ${{ secrets.XOYO_MS_CLIENT_ID }}
        # -Darch=arm64: chỉ đóng gói native lib và runtime Java cho arm64.
        # Bản "all" đóng gói cả 4 ABI và mọi runtime, nặng khoảng 400 MB.
        run: ./gradlew testDebugUnitTest assembleDebug -Darch=arm64 --stacktrace

      - name: Thống kê APK
        if: always()
        run: |
          shopt -s nullglob
          for f in ZalithLauncher/build/outputs/apk/debug/*.apk; do
            echo "== $f"
            ls -lh "$f"
            echo "-- 25 entry lớn nhất (dung lượng gốc, byte):"
            unzip -lv "$f" | sort -k1,1 -n -r | head -25
          done

      # Kiểm tra APK có đọc và cài được không. Trình cài Android báo
      # "phân tích cú pháp gói" khi APK hỏng, có entry trùng tên, hoặc không có chữ ký.
      - name: Kiểm tra APK có hợp lệ để cài không
        if: always()
        run: |
          shopt -s nullglob
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          for f in ZalithLauncher/build/outputs/apk/debug/*.apk; do
            echo "== $f"
            echo "-- Entry trùng tên (phải không có dòng nào):"
            unzip -Z1 "$f" | sort | uniq -d
            echo "-- Chữ ký (apksigner):"
            "${BT}apksigner" verify --verbose --print-certs "$f"
            echo "-- Thông tin gói (aapt2):"
            "${BT}aapt2" dump badging "$f" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label)"
          done

      - name: Lưu báo cáo kiểm thử khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ZalithLauncher/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Lưu APK debug
        uses: actions/upload-artifact@v4
        with:
          name: xoyo-launcher-debug
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
