name: Android CI

on:
  push:
    branches: [ main, zalith-base ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Đăng APK debug lên GitHub Release (pre-release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build và kiểm thử
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          # Lấy đủ lịch sử để bản build dưới máy tính được versionCode theo số commit
          fetch-depth: 0

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài đặt Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kiểm tra checksum của Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Cài Android NDK 25.2 (native build)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;25.2.9519653"

      - name: Cài Rust và các target Android (PetLib)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: PetLib/rust

      - name: Cài cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Đặt khóa ký phát hành cho APK (nếu có secret)
        # Bản debug đã được ký bằng khóa cố định đi kèm repo (xoyo_debug.p12) nên cài đè được.
        # Có secret XOYO_KEYSTORE_BASE64 thì dùng khóa phát hành riêng thay cho khóa debug đó.
        env:
          KEYSTORE_B64: ${{ secrets.XOYO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > ZalithLauncher/xoyo_release.jks
            echo "Đã đặt khóa ký cố định."
          else
            echo "Chưa có secret XOYO_KEYSTORE_BASE64: APK dùng khóa debug cố định trong repo."
          fi

      - name: Chạy unit test và build bản debug
        env:
          # Client ID là public, nhưng đưa qua secret để không phải commit vào repo.
          # Nếu chưa đặt secret thì build vẫn chạy; chỉ luồng đăng nhập Microsoft báo lỗi lúc chạy.
          OAUTH_CLIENT_ID: ${{ secrets.XOYO_MS_CLIENT_ID }}
          # Khóa CurseForge để tải mod, world, shader, modpack. Đặt secret trong Settings → Secrets and variables → Actions.
          # Chưa đặt secret thì APK vẫn build, nhưng phần tải từ CurseForge không hoạt động.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          # Thông số khóa ký cố định (xem bước "Đặt khóa ký cố định"). Thiếu secret thì bản debug vẫn ký bằng khóa tạm.
          STORE_PASSWORD: ${{ secrets.XOYO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XOYO_KEY_ALIAS || 'xoyo_release' }}
          KEY_PASSWORD: ${{ secrets.XOYO_KEY_PASSWORD }}
          # versionCode = launcher_version_code * 1000000 + số lần chạy.
          # Nhờ vậy mỗi bản CI mới đều có versionCode lớn hơn bản trước và cài đè được.
          ORG_GRADLE_PROJECT_buildNumber: ${{ github.run_number }}
        # -Darch=arm64: chỉ đóng gói native lib và runtime Java cho arm64.
        # Bản "all" đóng gói cả 4 ABI và mọi runtime, nặng khoảng 400 MB.
        run: ./gradlew testDebugUnitTest assembleDebug -Darch=arm64 --stacktrace

      - name: Thống kê APK
        if: always()
        run: |
          shopt -s nullglob
          for f in ZalithLauncher/build/outputs/apk/debug/*.apk; do
            echo "== $f"
            ls -lh "$f"
            echo "-- 25 entry lớn nhất (dung lượng gốc, byte):"
            unzip -lv "$f" | sort -k1,1 -n -r | head -25
          done

      # Kiểm tra APK có đọc và cài được không. Trình cài Android báo
      # "phân tích cú pháp gói" khi APK hỏng, có entry trùng tên, hoặc không có chữ ký.
      - name: Kiểm tra APK có hợp lệ để cài không
        if: always()
        run: |
          shopt -s nullglob
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          for f in ZalithLauncher/build/outputs/apk/debug/*.apk; do
            echo "== $f"
            echo "-- Entry trùng tên (phải không có dòng nào):"
            unzip -Z1 "$f" | sort | uniq -d
            echo "-- Chữ ký (apksigner):"
            "${BT}apksigner" verify --verbose --print-certs "$f"
            echo "-- Thông tin gói (aapt2):"
            "${BT}aapt2" dump badging "$f" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label)"
          done

      - name: Lưu báo cáo kiểm thử khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ZalithLauncher/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Lưu APK debug
        uses: actions/upload-artifact@v4
        with:
          name: xoyo-launcher-debug
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  # Chỉ chạy khi gọi thủ công và chọn publish=true. Đăng APK để tải trực tiếp, không cần zip.
  publish:
    name: Đăng APK lên GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Lấy mã nguồn (để gh biết repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Tải APK debug
        uses: actions/download-artifact@v4
        with:
          name: xoyo-launcher-debug
          path: apk

      - name: Tạo pre-release với APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$TAG" apk/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "XOYO Launcher debug $TAG" \
            --notes "Bản debug tự động từ commit $GITHUB_SHA. Đây là bản chỉnh sửa không chính thức (Unofficial Modified Version), chỉ dùng để thử nghiệm."
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].browser_download_url'
