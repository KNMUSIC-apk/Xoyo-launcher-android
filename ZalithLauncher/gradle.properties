# XOYO Launcher: bản fork của ZalithLauncher2 (GPL-3.0 kèm điều khoản bổ sung, xem LICENSE và NOTICE.md).

# launcher name & url
launcher_name=XoyoLauncher
launcher_app_name=XOYO Launcher
launcher_short_name=XOYO
url_home=https://github.com/KNMUSIC-apk/Xoyo-launcher-android

# Client ID OAuth của Microsoft (đăng ký riêng cho XOYO). Không đặt ở đây;
# truyền qua biến môi trường OAUTH_CLIENT_ID hoặc file .oauth_client_id.txt (đã nằm trong .gitignore).
#oauth_client_id=xxx

# CurseForge API key (tùy chọn). Truyền qua CURSEFORGE_API_KEY hoặc file .curseforge_api.txt.
#curseforge_api_key=xxx

# launcher version
launcher_version_code=1
launcher_version_name=0.1.0

# Không có protocol pháp lý của Zalith trong bản fork này.
# Build sẽ bỏ qua phần đó và không hiển thị màn hình đồng ý điều khoản.
